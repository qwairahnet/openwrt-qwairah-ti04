name: QWAIRAH-Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt and Inject Files
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout v23.05.3
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # دمج ملفات QWAIRAH والـ 70 نقطة والشعار
          if [ -d "../files" ]; then
            cp -r ../files/* package/base-files/files/
          fi

          # إعداد الكونفجريشن الأساسي
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_ca-bundle=y" >> .config

          make defconfig
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: QWAIRAH-Firmware-Files
          path: |
            openwrt/bin/targets/**/*.bin
