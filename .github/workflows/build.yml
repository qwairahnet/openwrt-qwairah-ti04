name: QWAIRAH-Firmware-Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
      - name: Build OpenWrt QWAIRAH
        run: |
          git clone --depth 1 --branch v23.05.3 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          cp -r ../files ./files
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat << 'CONF' > .config
CONFIG_TARGET_ipq40xx=y
CONFIG_TARGET_ipq40xx_generic=y
CONFIG_TARGET_ipq40xx_generic_DEVICE_giga_kt-9200=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-i18n-base-ar=y
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-app-commands=y
CONFIG_PACKAGE_luci-app-nlbwmon=y
CONFIG_PACKAGE_luci-app-advanced-reboot=y
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_wpad-mesh-openssl=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_ca-bundle=y
CONFIG_PACKAGE_lldpd=y
CONFIG_PACKAGE_iperf3=y
CONF
          make defconfig
          make -j$(nproc)
      - name: Upload Kernel and Sysupgrade Images
        uses: actions/upload-artifact@v4
        with:
          name: QWAIRAH-qwairah-ti04-Images
          path: |
            openwrt/bin/targets/ipq40xx/generic/*sysupgrade.bin
            openwrt/bin/targets/ipq40xx/generic/*kernel.bin
            openwrt/bin/targets/ipq40xx/generic/*initramfs*.bin
